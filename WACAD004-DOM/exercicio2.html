<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>

    <style>
        /* Classes base já preparadas no CSS */
        .card-tarefa { 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid;  
        }
        
        .card-sucesso { 
            background-color: #d4edda; 
        }
    </style>
</head>
<body>
    <div id="painel-sprint" style="max-width: 400px;">
    <h2>Tarefas da Sprint</h2>

        <div class="card-tarefa card-desatualizado">
            <h3 style="margin-top: 0;">Criar Banco de Dados</h3>
            <p>Status: <span>Finalizada</span></p>
        </div>

        <div class="card-tarefa card-urgente">
            <h3 style="margin-top: 0;">Corrigir bug de Login</h3>
            <p>Status: <span>Urgente</span></p>
        </div>

        <div class="card-tarefa card-desatualizado">
            <h3 style="margin-top: 0;">Atualizar Documentação</h3>
            <p>Status: <span>Finalizada</span></p>
        </div>

        <div class="card-tarefa card-desatualizado">
            <h3 style="margin-top: 0;">Subi a última versão para o Github</h3>
            <p>Status: <span>Finalizada</span></p>
        </div>

        <div class="card-tarefa card-urgente">
            <h3 style="margin-top: 0;">Corrigir os Testes</h3>
            <p>Status: <span>Urgente</span></p>
        </div>

    </div>

    <script>
        // a. Selecione os cards e substitua a classe card-desatualizado para card-sucesso
        const cardsDesatualizados = document.querySelectorAll('.card-desatualizado');
        cardsDesatualizados.forEach(card => {
            // O método replace tira a primeira classe e coloca a segunda no lugar
            card.classList.replace('card-desatualizado', 'card-sucesso');
        });

        // b. Utilizando o atributo style, atualize o backgroundColor dos cards-urgente
        const cardsUrgentes = document.querySelectorAll('.card-urgente');
        cardsUrgentes.forEach(card => {
            // No JS, propriedades CSS com traço viram camelCase (background-color vira backgroundColor)
            card.style.backgroundColor = '#f8d7da';
        });

        // c. Novamente utilizando o atributo style, coloque os textos de status em negrito
        // Selecionamos diretamente os <span> que estão dentro do <p> dentro de .card-tarefa
        const statusTextos = document.querySelectorAll('.card-tarefa p span');
        statusTextos.forEach(span => {
            span.style.fontWeight = 'bold';
        });
    </script>
</body>
</html>
