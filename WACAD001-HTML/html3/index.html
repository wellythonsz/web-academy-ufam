<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura Semântica HTML5</title>
    <style>
        body { font-family: sans-serif; text-align: center; display: flex; justify-content: center; background-color: #f4f4f4; }
        .container { width: 400px; background: white; padding: 10px; border: 1px solid #ddd; }
        header { background-color: #ff788f; padding: 20px; margin-bottom: 10px; border-radius: 4px; font-size: 24px; }
        nav { background-color: #55e2a3; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 18px; }
        .meio { display: flex; gap: 10px; margin-bottom: 10px; }
        aside { background-color: #f7cbd1; width: 30%; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 18px; }
        main { background-color: #cbeeff; width: 70%; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        article { background-color: #61daff; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        figure { background-color: #ffefaa; padding: 20px; margin: 0; border-radius: 4px; }
        p { background-color: #e5ff94; padding: 20px; margin: 0; border-radius: 4px; }
        section { background-color: #00aaff; padding: 20px; border-radius: 4px; }
        footer { background-color: #b388ff; padding: 20px; border-radius: 4px; font-size: 24px; }
    </style>
</head>
<body>

    <div class="container">
        <header>&lt;header&gt;</header>
        
        <nav>&lt;nav&gt;</nav>
        
        <div class="meio">
            <aside>&lt;aside&gt;</aside>
            
            <main>
                &lt;main&gt;
                <article>
                    &lt;article&gt;
                    <figure>&lt;figure&gt;</figure>
                    <p>&lt;p&gt;</p>
                </article>
                
                <section>&lt;section&gt;</section>
            </main>
        </div>
        
        <footer>&lt;footer&gt;</footer>
    </div>

</body>
</html>
