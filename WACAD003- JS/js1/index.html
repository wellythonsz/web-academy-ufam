<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Gerador de Histórias Arcanas</title>
    <style>
      body { font-family: helvetica, sans-serif; width: 350px; margin: 20px auto; }
      label { font-weight: bold; }
      div { padding-bottom: 20px; }
      input[type="text"] { padding: 5px; width: 150px; }
      p { background: #1a1a1a; color: #fff; padding: 10px; visibility: hidden; border-radius: 8px;}
      .generate { padding: 10px; background: #4a0072; color: white; border: none; cursor: pointer; border-radius: 5px;}
      .generate:hover { background: #32004f; }
    </style>
  </head>
  <body>
    <div>
      <label for="customname">Digite um nome personalizado:</label>
      <input id="customname" type="text" placeholder="" />
    </div>
    <div>
      <label for="us">US</label><input id="us" type="radio" name="ukus" value="us" checked />
      <label for="uk">UK</label><input id="uk" type="radio" name="ukus" value="uk" />
    </div>
    <div>
      <button class="generate">Gerar história aleatória</button>
    </div>
    <p class="story"></p>

    <!-- Conectando o nosso script -->
    <script src="main.js"></script>
  </body>
</html>
