<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineList Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">CineList Admin</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Sair</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="mb-4">
            <h2 class="fw-normal">Gerenciar Catálogo</h2>
        </div>
        
        <div class="d-flex justify-content-end mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAdicionarFilme">
                Adicionar Filme
            </button>
        </div>

        <div class="table-responsive border">
            <table class="table align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Gênero</th>
                        <th scope="col">Status</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-bold text-muted">01</td>
                        <td>O Senhor dos Anéis</td>
                        <td>Fantasia</td>
                        <td><span class="badge bg-success">Assistido</span></td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm">Editar</button>
                            <button class="btn btn-outline-danger btn-sm">Excluir</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="fw-bold text-muted">02</td>
                        <td>Interestelar</td>
                        <td>Ficção Científica</td>
                        <td><span class="badge bg-warning text-dark">Pendente</span></td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm">Editar</button>
                            <button class="btn btn-outline-danger btn-sm">Excluir</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="fw-bold text-muted">03</td>
                        <td>O Poderoso Chefão</td>
                        <td>Drama</td>
                        <td><span class="badge bg-success">Assistido</span></td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm">Editar</button>
                            <button class="btn btn-outline-danger btn-sm">Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalAdicionarFilme" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Novo Filme</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="nomeFilme" class="form-label">Nome do filme</label>
                            <input type="text" class="form-control" id="nomeFilme" placeholder="Ex: Matrix">
                        </div>
                        <div class="mb-3">
                            <label for="generoFilme" class="form-label">Gênero</label>
                            <input type="text" class="form-control" id="generoFilme" placeholder="Ex: Ficção Científica">
                        </div>
                        <div class="mb-3">
                            <label for="anoFilme" class="form-label">Ano de lançamento</label>
                            <input type="number" class="form-control" id="anoFilme" placeholder="Ex: 1999">
                        </div>
                        <div class="mb-3">
                            <label for="resumoFilme" class="form-label">Resumo da obra</label>
                            <textarea class="form-control" id="resumoFilme" rows="3" placeholder="Digite uma breve sinopse..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Salvar Filme</button>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold" id="menuLateralLabel">CineList</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush" id="menuLateralItens">
                <a href="#" class="list-group-item list-group-item-action text-bg-dark border-secondary">Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action active border-secondary" aria-current="true">Catálogo de Filmes</a>
                <a href="#" class="list-group-item list-group-item-action text-bg-dark border-secondary">Gerenciar Usuários</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const itensMenu = document.querySelectorAll('#menuLateralItens .list-group-item');

        itensMenu.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault(); 

                itensMenu.forEach(i => {
                    i.classList.remove('active');
                    i.removeAttribute('aria-current');
                    i.classList.add('text-bg-dark'); // Garante que volta a ter o fundo escuro padrão
                });

                this.classList.add('active');
                this.setAttribute('aria-current', 'true');
                this.classList.remove('text-bg-dark'); // Remove a classe escura para o azul do 'active' destacar perfeitamente
            });
        });
    </script>
</body>
</html>
