name: Build on DockerHub

on:
  push:
    paths:
      - "WACAD017 - Fundamentos de Integração Contínua - T7/LP03/lab03_docker/**"
      - ".github/workflows/wacad017-lp03-docker.yml"

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "WACAD017 - Fundamentos de Integração Contínua - T7/LP03/lab03_docker"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/webacademy:latest

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fazendo deploy
        run: echo "Deploy com sucesso!"
